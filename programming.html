<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>2026학년도 AI중점학교 중등 자료집 - 프로그래밍</title>

  <style>
    @font-face{
      font-family:'MaplestoryLight';
      src:url('fonts/MaplestoryLight.ttf') format('truetype');
      font-weight:normal;
      font-style:normal;
    }

    :root{
      --border:#e5e7eb;
      --text:#111827;
      --bg:#ffffff;
      --link:#2563eb;
      --muted:#6b7280;
    }

    body{
      font-family:'MaplestoryLight', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      margin:24px;
      color:var(--text);
      background:var(--bg);
    }

    h1{
      font-size:22px;
      font-weight:700;
      margin:0 0 16px 0;
    }

    .home-btn{
      display:inline-block;
      margin-bottom:18px;
      padding:8px 12px;
      border-radius:12px;
      border:1px solid var(--border);
      text-decoration:none;
      color:var(--text);
      background:#fff;
      font-weight:700;
      font-size:14px;
    }
    .home-btn:hover{ background:#f6f8fa; }

    .tabs{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom:20px;
    }
    .tab{
      padding:10px 14px;
      border:1px solid var(--border);
      border-radius:12px;
      background:#f9fafb;
      cursor:pointer;
      font-size:14px;
      font-weight:700;
      font-family:'MaplestoryLight', system-ui, sans-serif;
    }
    .tab.active{
      background:#111827;
      color:#fff;
      border-color:#111827;
    }

    .item{
      display:grid;
      grid-template-columns:420px 1fr;
      gap:16px;
      padding:18px 0;
      border-top:1px solid var(--border);
    }

    img{
      width:100%;
      border-radius:12px;
      border:1px solid var(--border);
      background:#f9fafb;
    }

    .badge{
      font-weight:700;
      font-size:14px;
      margin-bottom:10px;
    }

    .badge a{
      color:var(--link);
      text-decoration:underline;
    }
    .badge a:hover{ text-decoration:none; }

    .desc{
      white-space:pre-wrap;
      line-height:1.65;
      font-size:15px;
    }

    #status{ display:none; }

    .download-section{
      margin-bottom:24px;
      padding:16px 18px;
      border:1px solid var(--border);
      border-radius:14px;
      background:#f9fafb;
      display:flex;
      align-items:center;
      gap:12px;
      flex-wrap:wrap;
    }

    .download-section span{
      font-weight:700;
      font-size:14px;
      margin-right:4px;
    }

    .dl-btn{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:8px 14px;
      border-radius:10px;
      border:1px solid var(--border);
      background:#fff;
      text-decoration:none;
      color:var(--text);
      font-weight:700;
      font-size:13px;
      font-family:'MaplestoryLight', system-ui, sans-serif;
    }
    .dl-btn:hover{ background:#f0f4ff; border-color:#93c5fd; }

    @media (max-width: 900px){
      .item{ grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <h1>2026학년도 AI중점학교 중등 자료집 - 프로그래밍</h1>

  <a class="home-btn" href="index.html">목차</a>

  <div class="tabs">
    <button class="tab" id="tab-apps-script" onclick="switchPage('apps-script')">
      1. 구글 앱스크립트로 앱 만들기
    </button>
    <button class="tab" id="tab-gemini" onclick="switchPage('gemini')">
      2. 제미나이로 바이브 코딩하기
    </button>
  </div>

  <div id="download-section" class="download-section" style="display:none;">
    <span>파일 다운로드</span>
    <a class="dl-btn" href="data/Code.gs" download="Code.gs">⬇ Code.gs</a>
    <a class="dl-btn" href="data/Index.html" download="Index.html">⬇ Index.html</a>
  </div>

  <div id="status"></div>
  <div id="list"></div>

  <script>
    const listEl = document.getElementById('list');
    const downloadSection = document.getElementById('download-section');

    const pages = {
      'apps-script': { file: 'data/apps-script.json' },
      gemini:        { file: 'data/gemini-api.json' }
    };

    function escapeHtml(s){
      return String(s ?? '')
        .replaceAll('&','&amp;')
        .replaceAll('<','&lt;')
        .replaceAll('>','&gt;')
        .replaceAll('"','&quot;')
        .replaceAll("'","&#39;");
    }

    function setActiveTab(key){
      document.getElementById('tab-apps-script').classList.toggle('active', key === 'apps-script');
      document.getElementById('tab-gemini').classList.toggle('active', key === 'gemini');
    }

    function render(items){
      if(!items.length){
        listEl.innerHTML = '<p style="padding:20px; color:var(--muted);">준비 중입니다.</p>';
        return;
      }
      listEl.innerHTML = items.map(it => {
        const no = escapeHtml(it.no ?? '');
        const title = escapeHtml(it.title ?? '');
        const link = it.link ? escapeHtml(it.link) : '';
        const img = it.img ? escapeHtml(it.img) : '';
        const desc = escapeHtml(it.desc ?? '');

        return `
          <section class="item">
            <div>
              <div class="badge">
                Step ${no} -
                ${
                  link
                    ? `<a href="${link}" target="_blank" rel="noopener noreferrer">${title}</a>`
                    : title
                }
              </div>
              ${img ? `<img src="${img}" alt="step ${no}">` : ''}
            </div>
            <div class="desc">${desc}</div>
          </section>
        `;
      }).join('');
    }

    async function switchPage(key){
      setActiveTab(key);
      listEl.innerHTML = '';
      downloadSection.style.display = key === 'apps-script' ? 'flex' : 'none';

      try{
        const res = await fetch(pages[key].file, { cache:'no-store' });
        if(!res.ok) throw new Error();
        const items = await res.json();
        if(!Array.isArray(items)) throw new Error();

        items.sort((a,b)=>(a.no ?? 0) - (b.no ?? 0));
        render(items);
      }catch{
        listEl.innerHTML = '<p style="padding:20px; color:#ef4444;">JSON 파일을 찾을 수 없습니다.</p>';
      }
    }

    switchPage('apps-script');
  </script>
</body>
</html>
